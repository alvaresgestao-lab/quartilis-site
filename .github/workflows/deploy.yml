# Deploy automático: push na main → upload FTP pro cPanel
# Requer os secrets FTP_HOST, FTP_USER e FTP_PASS configurados no repositório.
name: Deploy FTP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar páginas a partir do conteúdo
        run: |
          find serenata.quartilis.com.br blog.quartilis.com.br -name index.html -delete
          python3 build.py
          python3 build_sub.py
      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            build.py
            build_sub.py
            content/**
            painel/config.php
